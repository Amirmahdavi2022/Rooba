name: Build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install NDK
        run: sdkmanager --install "ndk;26.1.10909125"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build release APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$SIGNING_PASSWORD" ]; then
            cp signing/rooba.jks release-keystore.jks
            export SIGNING_KEY_ALIAS=rooba
            export SIGNING_KEY_PASSWORD="$SIGNING_PASSWORD"
            export SIGNING_STORE_PASSWORD="$SIGNING_PASSWORD"
          else
            echo "::warning::SIGNING_PASSWORD secret is missing, building an unsigned APK"
          fi
          gradle :app:assembleRelease --no-daemon

      - name: Remove keystore
        if: always()
        run: rm -f release-keystore.jks

      - name: Rename APKs
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          APK=$(ls app/build/outputs/apk/release/app-release.apk 2>/dev/null || true)
          if [ -z "$APK" ]; then
            echo "::error::no signed APK (is SIGNING_PASSWORD set?)"
            ls app/build/outputs/apk/release/
            exit 1
          fi
          cp "$APK" "out/Rooba-${VERSION}.apk"
          ls -la out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: rooba-apks
          path: out/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
